serviceAccount: projects/syntoria/serviceAccounts/lore-build@syntoria.iam.gserviceaccount.com
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=asia-southeast1-docker.pkg.dev/syntoria/lore/runtime:$BUILD_ID
      - .
images:
  - asia-southeast1-docker.pkg.dev/syntoria/lore/runtime:$BUILD_ID
